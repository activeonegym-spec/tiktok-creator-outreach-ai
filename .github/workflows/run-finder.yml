
name: Run Creator Finder

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13-17 * * *"

jobs:
  find-creators:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate TikTok Search Links
        run: python search_links.py

      - name: Run Creator Finder
        run: python creator_finder.py

      - name: Save Search Links
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Search-Links
          path: search_links.md
