name: Run Creator Finder

on:
  workflow_dispatch:

jobs:
  find-creators:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Creator Finder
        run: python creator_finder.py
